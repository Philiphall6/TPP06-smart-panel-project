# Current interface: weather, touch sound, storage, restart buttons and Wi-Fi page.
# Linux Wi-Fi bridge commissioned at idle; real network migration still untested.
# Requires the optional Linux supervisor helper in addition to a firmware OTA.
# Compile in HA; no automatic reboot, Wi-Fi switch or boot-policy activation.
# Earlier templates remain available separately. Sound defaults ON; user OFF is saved.
substitutions:
  device_name: "tpp06-lvgl"
  # Use a unique device_name per panel. Keep a known IP during the first migration.
  device_address: "${device_name}.local"
  friendly_name: "TPP06 ESPHome LVGL"
  cover_entity: "cover.tpp06_example_cover"
  cave_light_entity: "light.tpp06_example_light_1"
  bar_light_entity: "light.tpp06_example_light_2"
  weather_entity: "weather.tpp06_example"
  weather_location: "Chez vous"
  # Age since receipt by the panel, not the weather provider's observation time.
  weather_max_age_ms: "7200000"
  cover_page_title: "Volet"
  light_1_page_title: "Lumiere 1"
  light_2_page_title: "Lumiere 2"
  cover_nav_label: "Volet"
  light_1_nav_label: "Lum. 1"
  light_2_nav_label: "Lum. 2"
  network_interface: "wlan0"
  framebuffer_device: "/dev/fb0"
  touchscreen_device: "/dev/input/event1"
  backlight_device: "backlight"
  # Palette and titles are local, editable settings; no private installation data.
  ui_background: "0x10131B"
  ui_card: "0x252C3A"
  ui_card_bottom: "0x191E29"
  ui_accent: "0x438DD1"
  ui_text: "0xF5F6FA"
  ui_muted: "0x9DA5B4"
  api_encryption_key: !secret tpp06_api_encryption_key

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  includes:
    - <stdio.h>
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Small code-native Home Assistant house/tree mark; no image download.
          lv_obj_add_event_cb(id(mobile_ha_logo), [](lv_event_t *e) {
            auto *obj = lv_event_get_target_obj(e);
            auto *ctx = lv_event_get_layer(e);
            lv_area_t area;
            lv_obj_get_coords(obj, &area);
            const lv_coord_t x = area.x1, y = area.y1;
            lv_draw_triangle_dsc_t roof;
            lv_draw_triangle_dsc_init(&roof);
            roof.p[0].x = x+2; roof.p[0].y = y+12;
            roof.p[1].x = x+14; roof.p[1].y = y+1;
            roof.p[2].x = x+26; roof.p[2].y = y+12;
            roof.color = lv_obj_get_style_text_color(obj, LV_PART_MAIN);
            lv_draw_triangle(ctx, &roof);
            lv_draw_rect_dsc_t fill;
            lv_draw_rect_dsc_init(&fill);
            fill.bg_color = lv_obj_get_style_text_color(obj, LV_PART_MAIN);
            const lv_area_t house = {lv_coord_t(x+2), lv_coord_t(y+12),
                                     lv_coord_t(x+26), lv_coord_t(y+26)};
            lv_draw_rect(ctx, &fill, &house);
            lv_draw_line_dsc_t line;
            lv_draw_line_dsc_init(&line);
            line.color = lv_color_hex(0x1B2330);
            line.width = 2;
            const lv_point_t stems[] = {{lv_coord_t(x+14), lv_coord_t(y+26)},
                {lv_coord_t(x+14), lv_coord_t(y+10)}, {lv_coord_t(x+14), lv_coord_t(y+22)},
                {lv_coord_t(x+8), lv_coord_t(y+17)}, {lv_coord_t(x+14), lv_coord_t(y+19)},
                {lv_coord_t(x+20), lv_coord_t(y+14)}};
            for (int i = 0; i < 6; i += 2) {
              line.p1.x = stems[i].x; line.p1.y = stems[i].y;
              line.p2.x = stems[i+1].x; line.p2.y = stems[i+1].y;
              lv_draw_line(ctx, &line);
            }
            fill.bg_color = line.color;
            fill.radius = LV_RADIUS_CIRCLE;
            for (int i : {1, 3, 5}) {
              const lv_area_t dot = {lv_coord_t(stems[i].x-2), lv_coord_t(stems[i].y-2),
                                    lv_coord_t(stems[i].x+2), lv_coord_t(stems[i].y+2)};
              lv_draw_rect(ctx, &fill, &dot);
            }
          }, LV_EVENT_DRAW_MAIN, nullptr);
      - script.execute: tpp06_refresh_connection
      - script.execute: tpp06_refresh_menu
      - lambda: id(panel_backlight).set_percent(id(mobile_brightness));
  project:
    name: philiphall6.tpp06
    version: "0.1.6-glass.2-dev"
  build_flags:
    - -static
    # Keep debug/symbol tables out of the OTA payload on the small /data volume.
    - -Wl,--strip-all
    - -pthread
    - -fno-threadsafe-statics
    - -Wl,-u,pthread_mutex_lock
    - -Wl,-u,pthread_mutex_init
    - -Wl,-u,pthread_mutex_trylock
    - -Wl,-u,pthread_mutex_unlock
    - -Wl,-u,pthread_mutex_destroy
    - -Wl,-u,pthread_self

external_components:
  - source:
      type: git
      url: https://github.com/Philiphall6/TPP06-smart-panel-project
      ref: v0.1.6
      path: esphome-components
    refresh: 5min
    components:
      - evdev
      - fbdev
      - host
      - md5
      - sha256
      - tpp06_compat
      - tpp06_mdns
      - tpp06_backlight
      - tpp06_ui
      - tpp06_buzzer
      - tpp06_system
      - tpp06_wifi

tpp06_ui:

# Optional local editor. Requires the separately commissioned Linux helper;
# without it the page stays read-only and no connection is changed.
tpp06_wifi:
  id: panel_wifi_editor

tpp06_buzzer:
  id: panel_buzzer

# Same ESPHome device as the local relay entities; no extra HA integration.
# Two explicit actions. Device reboot interrupts the network; relay states
# across a full Linux boot are not guaranteed. Neither button runs at startup.
button:
  - platform: tpp06_system
    id: panel_restart
    name: "Redemarrer ESPHome"
    mode: application
  - platform: tpp06_system
    id: panel_device_restart
    name: "Redemarrer le panneau"
    mode: device
    icon: mdi:power-cycle

switch:
  - platform: template
    id: touch_beep
    name: "Bip au toucher"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    lambda: return id(panel_buzzer).enabled();
    turn_on_action:
      - lambda: id(panel_buzzer).set_enabled(true);
      - script.execute: tpp06_refresh_menu
    turn_off_action:
      - lambda: id(panel_buzzer).set_enabled(false);
      - script.execute: tpp06_refresh_menu

tpp06_backlight:
  id: panel_backlight
  device: "${backlight_device}"

host:
  use_address: "${device_address}"
  network_interface: "${network_interface}"
  # The compiler is selected automatically: native Zig on ARM64 Home
  # Assistant hosts (Raspberry Pi), Bootlin GCC on x86-64 hosts.
  cross_compile: {}

tpp06_compat:

# The native host component only constructs records. This adapter publishes
# those records on Linux; it does not configure Wi-Fi or change DHCP.
mdns:
  disabled: false
tpp06_mdns:
  network_interface: "${network_interface}"

logger:
  level: INFO

# Synchronize Linux time through the encrypted HA API, without Tuya/NTP.
# Leave timezone unset so Home Assistant supplies the installation's timezone.
# Before HA connects, the clock can still be invalid after a cold boot.
time:
  - platform: homeassistant
    id: tpp06_ha_time
    on_time_sync:
      - if:
          condition:
            time.has_time:
          then:
            - logger.log:
                level: INFO
                format: "Home Assistant time synchronized"
      - script.execute: tpp06_refresh_clock

api:
  reboot_timeout: 0s
  encryption:
    key: "${api_encryption_key}"
  on_client_connected:
    - script.execute: tpp06_refresh_connection
  on_client_disconnected:
    - script.execute: tpp06_refresh_connection

# The first deployment is performed by TPP06 Cutter. Once this binary is
# running, Device Builder can update it directly over the LAN.
ota:
  - platform: esphome
    encryption:

dashboard_import:
  # "Take control" copies the complete LVGL configuration into Device Builder.
  # The owner can then freely edit every page, widget and Home Assistant action.
  package_import_url: github://Philiphall6/TPP06-smart-panel-project/esphome/tpp06-lvgl-modern.yaml@v0.1.6
  import_full_config: true

text_sensor:
  - platform: tpp06_system
    id: panel_storage
    name: "Stockage disponible et total"
    update_interval: 60s
  - platform: homeassistant
    id: mobile_weather_state
    entity_id: "${weather_entity}"
    internal: true
    on_value:
      - lambda: |-
          id(mobile_weather_received) = true;
          id(mobile_weather_stamp) = millis();
      - script.execute: tpp06_refresh_weather
  - platform: homeassistant
    id: mobile_weather_unit
    entity_id: "${weather_entity}"
    attribute: temperature_unit
    internal: true
    on_value:
      - script.execute: tpp06_refresh_weather
  - platform: homeassistant
    id: mobile_wind_unit
    entity_id: "${weather_entity}"
    attribute: wind_speed_unit
    internal: true
    on_value:
      - script.execute: tpp06_refresh_weather
  # Linux driver link indication, NOT Internet connectivity or signal strength.
  - platform: template
    id: mobile_wifi_state
    internal: true
    update_interval: 15s
    lambda: |-
      FILE *file = fopen("/sys/class/net/${network_interface}/carrier", "r");
      if (file == nullptr) return std::string("Wi-Fi : inconnu");
      const int carrier = fgetc(file);
      fclose(file);
      if (carrier == '1') return std::string("Wi-Fi : liaison active");
      if (carrier == '0') return std::string("Wi-Fi : sans liaison");
      return std::string("Wi-Fi : inconnu");
    on_value:
      - lambda: |-
          lv_obj_set_style_text_color(id(mobile_home_wifi),
              lv_color_hex(x == "Wi-Fi : liaison active" ? 0x75B7FA : ${ui_muted}), 0);
      - lvgl.label.update:
          id: mobile_diag_wifi
          text: !lambda return x;
  - platform: version
    id: mobile_version
    hide_timestamp: true
    hide_hash: true
    name: "Version ESPHome"
    entity_category: diagnostic

  - platform: homeassistant
    id: ha_cover_sdb_state
    entity_id: "${cover_entity}"
    internal: true
    on_value:
      - lvgl.label.update:
          id: cover_state_label
          text: !lambda |-
            if (x == "open") return std::string("OUVERT");
            if (x == "closed") return std::string("FERME");
            if (x == "opening") return std::string("OUVERTURE...");
            if (x == "closing") return std::string("FERMETURE...");
            return std::string("ETAT INCONNU");

  - platform: homeassistant
    id: ha_cave_state
    entity_id: "${cave_light_entity}"
    internal: true
    on_value:
      - lvgl.label.update:
          id: cave_state_label
          text: !lambda |-
            if (x == "on") return std::string("ALLUMEE");
            if (x == "off") return std::string("ETEINTE");
            return std::string("INDISPONIBLE");
          text_color: !lambda |-
            return x == "on" ? lv_color_hex(0x52D273) : lv_color_hex(0x9AA4B2);

  - platform: homeassistant
    id: ha_cave_bar_state
    entity_id: "${bar_light_entity}"
    internal: true
    on_value:
      - lvgl.label.update:
          id: bar_state_label
          text: !lambda |-
            if (x == "on") return std::string("ALLUMEE");
            if (x == "off") return std::string("ETEINTE");
            return std::string("INDISPONIBLE");
          text_color: !lambda |-
            return x == "on" ? lv_color_hex(0x52D273) : lv_color_hex(0x9AA4B2);

sensor:
  - platform: homeassistant
    id: mobile_weather_temperature
    entity_id: "${weather_entity}"
    attribute: temperature
    internal: true
    on_value:
      - lambda: id(mobile_temperature_stamp) = millis();
      - script.execute: tpp06_refresh_weather
  - platform: homeassistant
    id: mobile_weather_humidity
    entity_id: "${weather_entity}"
    attribute: humidity
    internal: true
    on_value:
      - lambda: id(mobile_humidity_stamp) = millis();
      - script.execute: tpp06_refresh_weather
  - platform: homeassistant
    id: mobile_weather_wind
    entity_id: "${weather_entity}"
    attribute: wind_speed
    internal: true
    on_value:
      - lambda: id(mobile_wind_stamp) = millis();
      - script.execute: tpp06_refresh_weather
  - platform: uptime
    id: mobile_uptime
    name: "Duree de fonctionnement"
    entity_category: diagnostic
    update_interval: 30s

  - platform: homeassistant
    id: mobile_cave_brightness_from_ha
    entity_id: "${cave_light_entity}"
    attribute: brightness
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !std::isnan(x);
          then:
            - lvgl.slider.update:
                id: cave_brightness
                value: !lambda return static_cast<int>(std::max(1.0f, std::min(100.0f, x * 100.0f / 255.0f)));
            - lvgl.label.update:
                id: cave_brightness_value
                text: !lambda return str_sprintf("%.0f %%", x * 100.0f / 255.0f);
          else:
            - lvgl.label.update:
                id: cave_brightness_value
                text: "-- %"

  - platform: homeassistant
    id: mobile_bar_brightness_from_ha
    entity_id: "${bar_light_entity}"
    attribute: brightness
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !std::isnan(x);
          then:
            - lvgl.slider.update:
                id: bar_brightness
                value: !lambda return static_cast<int>(std::max(1.0f, std::min(100.0f, x * 100.0f / 255.0f)));
            - lvgl.label.update:
                id: bar_brightness_value
                text: !lambda return str_sprintf("%.0f %%", x * 100.0f / 255.0f);
          else:
            - lvgl.label.update:
                id: bar_brightness_value
                text: "-- %"

display:
  - platform: fbdev
    id: tpp06_display
    device: "${framebuffer_device}"
    pixel_format: RGB565  # Verified scanout; vendor fbdev metadata says BGR565.
    dimensions:
      width: 320
      height: 480
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: evdev
    id: tpp06_touch
    display: tpp06_display
    device: "${touchscreen_device}"
    update_interval: 20ms
    on_touch:
      - lambda: id(panel_buzzer).click();
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 480


# Native LVGL only: built-in symbol fonts, no bitmap wallpaper or cloud font.
# This is a separate design candidate. Compile in HA and test before deployment.
globals:
  - id: mobile_weather_received
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: mobile_weather_stamp
    type: uint32_t
    initial_value: '0'
    restore_value: false
  - id: mobile_temperature_stamp
    type: uint32_t
    initial_value: '0'
    restore_value: false
  - id: mobile_humidity_stamp
    type: uint32_t
    initial_value: '0'
    restore_value: false
  - id: mobile_wind_stamp
    type: uint32_t
    initial_value: '0'
    restore_value: false
  - id: mobile_brightness
    type: int
    restore_value: true
    initial_value: '100'
  # 0=never, 1=30s, 2=60s, 3=120s, 4=300s. Disabled until the owner
  # has verified touch/wake on their hardware. Independent of Linux/network.
  - id: mobile_sleep_choice
    type: int
    restore_value: true
    initial_value: '0'
  # Persistence needs writable ESPHOME_PREFDIR (or HOME) on the Linux host.
  - id: mobile_clock_12h
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: mobile_clock_visible
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: mobile_purple_accent
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: mobile_active_nav
    type: int
    restore_value: false
    initial_value: '4'

script:
  - id: tpp06_refresh_connection
    then:
      - lambda: |-
          // UI indication only, not authentication. A Builder log connection
          // must not turn the HA logo blue. Inspect the live API clients.
          bool connected = false;
          for (const auto &client : esphome::api::global_api_server->active_clients()) {
            const char *name = client->get_name();
            if (name != nullptr && std::string(name).find("Home Assistant ") == 0)
              connected = true;
          }
          // One gentle blue pulse, started only on connection transitions.
          // Never fade to invisible; grey and stationary while disconnected.
          static bool was_connected = false;
          static const lv_anim_exec_xcb_t pulse = [](void *target, int32_t value) {
            lv_obj_set_style_text_color(static_cast<lv_obj_t *>(target),
                lv_color_mix(lv_color_hex(0x18BCF2), lv_color_hex(0x176C97), value), 0);
          };
          if (connected && !was_connected) {
            lv_anim_t animation;
            lv_anim_init(&animation);
            lv_anim_set_var(&animation, id(mobile_ha_logo));
            lv_anim_set_exec_cb(&animation, pulse);
            lv_anim_set_values(&animation, 100, 255);
            lv_anim_set_duration(&animation, 1400);
            lv_anim_set_reverse_duration(&animation, 1400);
            lv_anim_set_repeat_count(&animation, LV_ANIM_REPEAT_INFINITE);
            lv_anim_set_path_cb(&animation, lv_anim_path_ease_in_out);
            lv_anim_start(&animation);
          } else if (!connected) {
            if (was_connected) lv_anim_delete(id(mobile_ha_logo), pulse);
            lv_obj_set_style_text_color(id(mobile_ha_logo), lv_color_hex(${ui_muted}), 0);
          }
          was_connected = connected;
  - id: tpp06_refresh_wifi_scan
    then:
      - lambda: |-
          id(panel_wifi_editor).refresh_scan();
          lv_label_set_text(id(mobile_wifi_scan_status), id(panel_wifi_editor).scan_status_text().c_str());
          lv_label_set_text(id(mobile_wifi_scan_0), id(panel_wifi_editor).scan_row_text(0).c_str());
          lv_label_set_text(id(mobile_wifi_scan_1), id(panel_wifi_editor).scan_row_text(1).c_str());
          lv_label_set_text(id(mobile_wifi_scan_2), id(panel_wifi_editor).scan_row_text(2).c_str());
          lv_label_set_text(id(mobile_wifi_scan_3), id(panel_wifi_editor).scan_row_text(3).c_str());
  - id: tpp06_select_wifi
    parameters:
      row: int
    then:
      - if:
          condition:
            lambda: return !id(panel_wifi_editor).scan_row_ssid(row).empty();
          then:
            - lvgl.textarea.update:
                id: mobile_wifi_ssid
                text: !lambda return id(panel_wifi_editor).scan_row_ssid(row);
            - lvgl.textarea.update:
                id: mobile_wifi_password
                text: ""
            - lvgl.keyboard.update:
                id: mobile_wifi_keyboard
                textarea: mobile_wifi_password
            - lvgl.page.show: page_wifi_settings
  - id: tpp06_refresh_weather
    then:
      - lambda: |-
          using namespace esphome::tpp06_ui;
          const auto stamp = millis();
          const bool recent = fresh(id(mobile_weather_received), stamp,
              id(mobile_weather_stamp), ${weather_max_age_ms});
          const auto state = id(mobile_weather_state).state;
          const bool ready = recent && known_condition(state);
          const std::string condition = !id(mobile_weather_received) ? "Meteo a configurer" :
              !recent ? "Donnees anciennes" : condition_fr(state);
          lv_label_set_text(id(mobile_weather_condition), condition.c_str());
          lv_label_set_text(id(mobile_weather_detail_condition), condition.c_str());
          const auto temp = temperature(ready && fresh(id(mobile_weather_temperature).has_state(),
              stamp, id(mobile_temperature_stamp), ${weather_max_age_ms}),
              id(mobile_weather_temperature).state, id(mobile_weather_unit).state);
          lv_label_set_text(id(mobile_weather_temp), temp.c_str());
          lv_label_set_text(id(mobile_weather_detail_temp), temp.c_str());
          const auto humidity = percent(ready && fresh(id(mobile_weather_humidity).has_state(),
              stamp, id(mobile_humidity_stamp), ${weather_max_age_ms}), id(mobile_weather_humidity).state);
          lv_label_set_text(id(mobile_weather_humidity_label), humidity.c_str());
          const auto wind = wind_speed(ready && fresh(id(mobile_weather_wind).has_state(),
              stamp, id(mobile_wind_stamp), ${weather_max_age_ms}),
              id(mobile_weather_wind).state, id(mobile_wind_unit).state);
          lv_label_set_text(id(mobile_weather_wind_label), wind.c_str());
          const auto age = receipt_age(id(mobile_weather_received), stamp, id(mobile_weather_stamp));
          lv_label_set_text(id(mobile_weather_age), age.c_str());
          lv_obj_set_style_opa(id(mobile_weather_art), ready ? LV_OPA_COVER : LV_OPA_30, 0);
          const bool sun = ready && (state == "sunny" || state == "partlycloudy");
          lv_obj_set_style_bg_color(id(mobile_weather_sun), lv_color_hex(sun ? 0xFFD27D : 0x7186A6), 0);
  - id: tpp06_refresh_clock
    then:
      - lvgl.label.update:
          id: mobile_clock
          text: !lambda |-
            auto now = id(tpp06_ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime(id(mobile_clock_12h) ? "%I:%M %p" : "%H:%M");
      - lvgl.label.update:
          id: mobile_home_clock
          text: !lambda |-
            auto now = id(tpp06_ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime(id(mobile_clock_12h) ? "%I:%M %p" : "%H:%M");
      - lvgl.label.update:
          id: mobile_home_date
          text: !lambda |-
            auto now = id(tpp06_ha_time).now();
            if (!now.is_valid()) return std::string("Date en attente de HA");
            const char *days[] = {"", "Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"};
            const char *months[] = {"", "janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre"};
            return str_sprintf("%s %d %s", days[now.day_of_week], now.day_of_month, months[now.month]);
      - lvgl.label.update:
          id: mobile_home_greeting
          text: !lambda |-
            auto now = id(tpp06_ha_time).now();
            if (!now.is_valid()) return std::string("Bienvenue");
            return std::string(now.hour >= 18 || now.hour < 6 ? "Bonsoir" : "Bonjour");
      - lvgl.widget.update:
          id: mobile_clock
          hidden: !lambda return !id(mobile_clock_visible);
  - id: tpp06_refresh_menu
    then:
      - script.execute: tpp06_refresh_clock
      - script.execute: tpp06_refresh_weather
      - lvgl.label.update:
          id: mobile_beep_summary
          text: !lambda |-
            if (!id(panel_buzzer).available()) return std::string("Pilote indisponible / voir les options");
            return std::string(id(panel_buzzer).enabled() ? "Active / voir les options" : "Desactive / voir les options");
      - lvgl.label.update:
          id: mobile_beep_mode
          text: !lambda |-
            if (!id(panel_buzzer).available()) return std::string("Pilote indisponible");
            return std::string(id(panel_buzzer).enabled() ? "Bip active" : "Silencieux");
      - lvgl.label.update:
          id: mobile_beep_value
          text: !lambda |-
            if (!id(panel_buzzer).available()) return std::string("Activation impossible : consulter les logs");
            return std::string(id(panel_buzzer).enabled() ? "Actif / toucher pour desactiver" : "Inactif / toucher pour activer");
      - lvgl.widget.update:
          id: mobile_beep_enable
          state:
            disabled: !lambda return !id(panel_buzzer).available();
      - lvgl.label.update:
          id: mobile_sleep_value
          text: !lambda |-
            const char *choices[] = {"Jamais", "30 secondes", "1 minute", "2 minutes", "5 minutes"};
            const int choice = id(mobile_sleep_choice);
            if (!id(panel_backlight).available()) return std::string("Pilote indisponible");
            return std::string(choices[choice >= 0 && choice <= 4 ? choice : 0]);
      - lvgl.label.update:
          id: mobile_brightness_value
          text: !lambda |-
            if (!id(panel_backlight).available()) return std::string("Luminosite : indisponible");
            return str_sprintf("Luminosite : %d %%", id(mobile_brightness));
      - lvgl.slider.update:
          id: mobile_brightness_slider
          value: !lambda return id(mobile_brightness);
      - lvgl.label.update:
          id: mobile_format_value
          text: !lambda |-
            return std::string(id(mobile_clock_12h) ? "12 h / AM-PM" : "24 heures");
      - lvgl.label.update:
          id: mobile_visibility_value
          text: !lambda |-
            return std::string(id(mobile_clock_visible) ? "Visible" : "Masquee");
      - lvgl.label.update:
          id: mobile_accent_value
          text: !lambda |-
            return std::string(id(mobile_purple_accent) ? "Violet" : "Couleur du YAML");
      - lvgl.label.update:
          id: mobile_diag_clock
          text: !lambda |-
            return std::string(id(tpp06_ha_time).now().is_valid() ? "Horloge : valide" : "Horloge : en attente");
      - lvgl.label.update:
          id: mobile_diag_uptime
          text: !lambda |-
            const float seconds = id(mobile_uptime).state;
            if (std::isnan(seconds)) return std::string("Application : en attente");
            return str_sprintf("Application : %.0f min", seconds / 60.0f);
      - lvgl.label.update:
          id: mobile_diag_version
          text: !lambda return std::string("V6 / ESPHome ") + id(mobile_version).state;
      - lambda: |-
          // Small native gradients: no blur surfaces, bitmaps or animation loop.
          lv_obj_t *tabs[] = {id(mobile_nav_0), id(mobile_nav_1), id(mobile_nav_2),
                              id(mobile_nav_3), id(mobile_nav_4)};
          const auto accent = lv_color_hex(id(mobile_purple_accent) ? 0xBF5AF2 : ${ui_accent});
          for (int i = 0; i < 5; ++i) {
            const bool selected = id(mobile_active_nav) == i;
            lv_obj_set_style_bg_opa(tabs[i], selected ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_color(tabs[i], accent, 0);
            lv_obj_set_style_bg_grad_color(tabs[i], lv_color_hex(0x25374E), 0);
            lv_obj_set_style_bg_grad_dir(tabs[i], LV_GRAD_DIR_VER, 0);
            lv_obj_set_style_border_width(tabs[i], selected ? 1 : 0, 0);
            lv_obj_set_style_border_color(tabs[i], accent, 0);
            lv_obj_set_style_shadow_width(tabs[i], selected ? 8 : 0, 0);
            lv_obj_set_style_shadow_color(tabs[i], accent, 0);
            lv_obj_set_style_shadow_opa(tabs[i], LV_OPA_20, 0);
            const auto ink = lv_color_hex(selected ? ${ui_text} : ${ui_muted});
            for (uint32_t child = 0; child < lv_obj_get_child_cnt(tabs[i]); ++child)
              lv_obj_set_style_text_color(lv_obj_get_child(tabs[i], child), ink, 0);
          }

interval:
  - interval: 2s
    then:
      - script.execute: tpp06_refresh_connection
      - script.execute: tpp06_refresh_wifi_scan
      - lvgl.label.update:
          id: mobile_wifi_editor_status
          text: !lambda return id(panel_wifi_editor).status_text();
  - interval: 15s
    then:
      - script.execute: tpp06_refresh_menu

lvgl:
  id: mobile_ui
  displays: tpp06_display
  touchscreens:
    - touchscreen_id: tpp06_touch
  buffer_size: 25%
  resume_on_input: true
  on_idle:
    - timeout: !lambda |-
        const uint32_t delays[] = {86400000, 30000, 60000, 120000, 300000};
        const int choice = id(mobile_sleep_choice);
        return delays[choice >= 0 && choice <= 4 ? choice : 0];
      then:
        - if:
            condition:
              lambda: return id(mobile_sleep_choice) > 0 && id(mobile_sleep_choice) <= 4 && id(panel_backlight).available();
            then:
              - lvgl.pause:
  on_pause:
    - lambda: |-
        if (!id(panel_backlight).sleep()) id(mobile_ui).set_paused(false, false);
  on_resume:
    - lambda: id(panel_backlight).wake();
    - script.execute: tpp06_refresh_clock
