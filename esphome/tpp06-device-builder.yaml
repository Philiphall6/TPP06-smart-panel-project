# Small, automatically updated entry point for the official Device Builder.
# Use this managed version when you only need to change the substitutions.
# To edit the complete LVGL interface, import esphome/tpp06-lvgl.yaml instead;
# dashboard adoption also imports that complete editable file automatically.
substitutions:
  device_name: "tpp06-lvgl"
  device_address: "${device_name}.local" # Keep a known IP for the first migration.
  friendly_name: "TPP06 ESPHome LVGL"
  api_encryption_key: !secret tpp06_api_encryption_key
  cover_entity: "cover.tpp06_example_cover"
  cave_light_entity: "light.tpp06_example_light_1"
  bar_light_entity: "light.tpp06_example_light_2"
  cover_page_title: "VOLET"
  light_1_page_title: "ECLAIRAGE 1"
  light_2_page_title: "ECLAIRAGE 2"
  cover_nav_label: "VOLET"
  light_1_nav_label: "LUM. 1"
  light_2_nav_label: "LUM. 2"
  framebuffer_device: "/dev/fb0"
  touchscreen_device: "/dev/input/event1"

packages:
  tpp06:
    url: https://github.com/Philiphall6/TPP06-smart-panel-project
    ref: main
    file: esphome/tpp06-lvgl.yaml
    refresh: 5min
