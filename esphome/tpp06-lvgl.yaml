        - slider:
            id: bar_brightness
            x: 20
            y: 215
            width: 280
            height: 28
            min_value: 1
            max_value: 100
            value: 70
            on_release:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: "${bar_light_entity}"
                  data_template:
                    brightness_pct: "{{ brightness }}"
                  variables:
                    brightness: !lambda return static_cast<int>(x);
        - label:
            x: 24
            y: 263
            text: "COULEUR"
            text_color: 0xC8D2DC
        - button:
            x: 20
            y: 295
            width: 52
            height: 52
            bg_color: 0xFF3030
            on_click:
              - homeassistant.action:
                  action: light.turn_on
                  data: {entity_id: "${bar_light_entity}", color_name: red}
        - button:
            x: 77
            y: 295
            width: 52
            height: 52
            bg_color: 0x30D060
            on_click:
              - homeassistant.action:
                  action: light.turn_on
                  data: {entity_id: "${bar_light_entity}", color_name: green}
        - button:
            x: 134
            y: 295
            width: 52
            height: 52
            bg_color: 0x3080FF
            on_click:
              - homeassistant.action:
                  action: light.turn_on
                  data: {entity_id: "${bar_light_entity}", color_name: blue}
        - button:
            x: 191
            y: 295
            width: 52
            height: 52
            bg_color: 0xB060FF
            on_click:
              - homeassistant.action:
                  action: light.turn_on
                  data: {entity_id: "${bar_light_entity}", color_name: purple}
        - button:
            x: 248
            y: 295
            width: 52
            height: 52
            bg_color: 0xFFF1D0
            on_click:
              - homeassistant.action:
                  action: light.turn_on
                  data: {entity_id: "${bar_light_entity}", color_temp_kelvin: "2700"}
        - button:
            x: 10
            y: 415
            width: 96
            height: 52
            bg_color: 0x263645
            widgets:
              - label: {align: center, text: "${cover_nav_label}"}
            on_click:
              - lvgl.page.show: page_sdb
        - button:
            x: 112
            y: 415
            width: 96
            height: 52
            bg_color: 0x263645
            widgets:
              - label: {align: center, text: "${light_1_nav_label}"}
            on_click:
              - lvgl.page.show: page_cave
        - button:
            x: 214
            y: 415
            width: 96
            height: 52
            bg_color: 0x276B9E
            widgets:
              - label: {align: center, text: "${light_2_nav_label}"}
